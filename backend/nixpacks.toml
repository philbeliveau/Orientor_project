# Backend deployment configuration
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
    "pip install --upgrade pip", 
    "pip install -r requirements-minimal.txt"
]

[start]
cmd = "python main_phase1_deploy.py"